<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Offline · Vendora</title>
    <style>
      :root { color-scheme: light dark; }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 1rem;
        padding: 2rem;
        text-align: center;
        font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        background: #fafafa;
        color: #1a1a1a;
      }
      @media (prefers-color-scheme: dark) {
        body { background: #121212; color: #ededed; }
      }
      img { width: 140px; height: auto; opacity: 0.9; }
      h1 { font-size: 1.25rem; margin: 0.5rem 0 0; }
      p { margin: 0; max-width: 26rem; line-height: 1.5; opacity: 0.75; }
      button {
        margin-top: 0.5rem;
        border: 0;
        border-radius: 0.6rem;
        background: #d4af37;
        color: #1a1a1a;
        font: inherit;
        font-weight: 600;
        padding: 0.7rem 1.4rem;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <img src="/icon-512.png" alt="Vendora" />
    <h1>Keine Internetverbindung</h1>
    <p>
      Diese Seite ist noch nicht offline verfügbar. Der Marktmodus funktioniert
      auch ohne Netz – erfasste Verkäufe werden gespeichert und synchronisieren
      sich automatisch, sobald du wieder online bist.
    </p>
    <p id="register-hint" hidden>
      <a id="register-link" href="#">Zur zuletzt geöffneten Kasse</a>
    </p>
    <button onclick="location.reload()">Erneut versuchen</button>
    <script>
      // Der Einstieg der installierten App ist das Dashboard, und das wird
      // bewusst nicht zwischengespeichert (es gehoert zu genau einem Konto).
      // Ohne diesen Link endet ein Kaltstart am Markttag ohne Empfang hier --
      // im Standalone-Modus gibt es nicht einmal eine Adressleiste. Die Kasse
      // hinterlegt ihre Adresse, sobald sie einmal offen war.
      try {
        var last = localStorage.getItem("vendora-last-register");
        if (last) {
          var link = document.getElementById("register-link");
          link.setAttribute("href", last);
          document.getElementById("register-hint").hidden = false;
        }
      } catch (e) {
        /* localStorage nicht verfuegbar */
      }
    </script>
  </body>
</html>
