name: Security & Quality Check

on:
  push:
  pull_request:
  schedule:
    - cron: "0 8 * * 1" # Every Monday at 8:00 UTC

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm ci

      # Blocking: anything that ships to production must be clean at high+.
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      # Informational: the lint/test toolchain (eslint -> minimatch/brace-expansion,
      # eslint -> eslintrc/js-yaml) carries DoS advisories with no fix inside the
      # supported range. That code never runs in the deployed app, so it must not
      # block the checks below — but it stays visible in the log.
      - name: Audit all dependencies (informational)
        continue-on-error: true
        run: npm audit --audit-level=high

      - name: Type check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Tests
        run: npm test

      - name: Build
        run: npm run build
        env:
          # Secrets are injected at deploy time, not in CI; skip env validation.
          SKIP_ENV_VALIDATION: "true"
